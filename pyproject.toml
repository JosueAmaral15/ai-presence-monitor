[project]
name = "ai-presence-monitor"
version = "0.4.3"
description = "Monitor local de presenca artificial com alertas por Discord e Telegram."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "coverage>=7.6",
    "mypy>=1.11",
    "ruff>=0.8",
]

[project.scripts]
ai-presence = "ai_presence_monitor.cli:main"
ai-presence-interactive = "ai_presence_monitor.interactive:main"
ai-presence-codex-hook = "ai_presence_monitor.codex_hook:main"
ai-presence-codex-hooks = "ai_presence_monitor.codex_hook_installer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["ai_presence_monitor"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
