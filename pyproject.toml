[project]
name = "ai-presence-monitor"
version = "0.13.0"
description = "Local AI-worker presence monitor with alerts and guarded automation."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["ai-agent", "monitoring", "discord", "codex", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.urls]
Repository = "https://github.com/JosueAmaral15/ai-presence-monitor"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "coverage>=7.6",
    "mypy>=1.11",
    "ruff>=0.8",
    "setuptools>=77",
]
tray = [
    "PySide6>=6.7",
]

[project.scripts]
ai-presence = "ai_presence_monitor.cli:main"
ai-presence-interactive = "ai_presence_monitor.interactive:main"
ai-presence-codex-hook = "ai_presence_monitor.codex_hook:main"
ai-presence-codex-hooks = "ai_presence_monitor.codex_hook_installer:main"
ai-presence-tray = "ai_presence_monitor.tray:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["ai_presence_monitor"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true
